name: Build Installers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-installers:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/alibre-shapes-addon.csproj
    
    - name: Build project
      run: dotnet build src/alibre-shapes-addon.csproj -c Release -f net481 --no-restore
    
    - name: Setup Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT", "/NORESTART" -Wait
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
    
    - name: Build Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "alibre-shapes-addon.iss"
    
    - name: Upload Inno Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inno-setup-installer
        path: installer/*.exe
    
    # Note: Advanced Installer requires a license and would need to be set up separately
    # - name: Build Advanced Installer (if license available)
    #   run: |
    #     # Advanced Installer command line build would go here
    #     # This requires a valid Advanced Installer license
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installer/*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
